<nav aria-label="Main navigation">
  <ul>
    @for (tab of tabs(); track tab.path) {
      <li>
        <a
          [routerLink]="tab.path"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: tab.exact }"
        >
          <svg [lucideIcon]="tab.icon"></svg>
          <span> {{ tab.label }}</span>
        </a>
      </li>
    }
  </ul>
</nav>
