<app-avatar-category [category]="habit().category" />

<div class="info">
  <p class="name">{{ habit().name }}</p>
  <p class="meta">{{ habitScheduleLabel() }}</p>
</div>

<a [routerLink]="[habit().id, 'edit']" [attr.aria-label]="'Edit ' + habit().name">
  <svg lucideSquarePen [size]="20" [strokeWidth]="2"></svg>
</a>

<button
  type="button"
  [attr.aria-label]="'Delete ' + habit().name"
  (click)="delete.emit(habit().id)"
>
  <svg lucideTrash [size]="20" [strokeWidth]="2"></svg>
</button>
