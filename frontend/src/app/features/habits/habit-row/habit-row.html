<p>{{ habit().name }} ({{ habit().category }})</p>
<button
  [attr.aria-label]="'delete ' + habit().name"
  type="button"
  (click)="delete.emit(habit().id)"
>
  Delete
</button>
<a
  [routerLink]="[habit().id, 'edit']"
  aria-label="Edit habit"
  [attr.aria-label]="'edit ' + habit().name"
>
  <svg lucideSquarePen [size]="22" [strokeWidth]="2.4"></svg>
</a>
