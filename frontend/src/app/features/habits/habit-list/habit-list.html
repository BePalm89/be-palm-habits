<header>
  <h1>Habits</h1>
  <a routerLink="add">
    <svg lucidePlus [size]="18" [strokeWidth]="2.4" aria-hidden="true"></svg>
    New
  </a>
</header>

@if (habits().length) {
  <ul>
    @for (habit of habits(); track habit.id) {
      <li>
        <app-habit-row [habit]="habit" (delete)="onDelete($event)" />
      </li>
    }
  </ul>
} @else {
  <p class="empty">No habits yet</p>
}
