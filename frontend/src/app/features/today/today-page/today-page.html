<app-today-header [today]="today()"></app-today-header>

@if (habitsForToday().length) {
  <app-today-summary
    [done]="done()"
    [total]="total()"
    [remaining]="remaining()"
  ></app-today-summary>
  <ul>
    @for (habit of habitsForToday(); track habit.id) {
      <li>
        <app-today-habit-row
          [habit]="habit"
          (toggle)="onToggle($event)"
          [isDone]="habit.completedDates.includes(todayKey())"
        ></app-today-habit-row>
      </li>
    }
  </ul>
} @else {
  <p>No habits for today</p>
}
