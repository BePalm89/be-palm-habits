<svg width="76" height="76" viewBox="0 0 84 84" aria-hidden="true">
  <circle
    cx="42"
    cy="42"
    r="34"
    stroke-width="10"
    stroke="var(--color-ring-track)"
    fill="none"
  ></circle>
  <text
    x="42"
    y="48"
    text-anchor="middle"
    font-size="18"
    fill="var(--color-text)"
    font-family="var(--font-heading)"
    font-weight="700"
  >
    {{ percentage() }}%
  </text>
  <circle
    cx="42"
    cy="42"
    r="34"
    stroke-width="10"
    stroke="var(--color-accent-text)"
    fill="none"
    stroke-linecap="round"
    [attr.stroke-dasharray]="circumference"
    [attr.stroke-dashoffset]="percentageRing()"
    transform="rotate(-90 42 42)"
  ></circle>
</svg>
<div class="text">
  <p class="title">{{ done() }} of {{ total() }} done</p>
  @if (remaining().length === 0) {
    <p class="remaining">All done for today!</p>
  } @else {
    <p class="remaining">Left: {{ remaining().join(', ') }}</p>
  }
</div>
